<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Callback</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 46rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      min-height: 9rem;
      box-sizing: border-box;
      font: 1.15rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 0.75rem;
    }
    .note {
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <h1>Callback</h1>
  <p class="note">Copy this whole address back to your assistant.</p>
  <textarea id="url" readonly spellcheck="false"></textarea>
  <script>
    const box = document.getElementById("url");
    box.value = window.location.href;
    box.focus();
    box.select();
  </script>
</body>
</html>
